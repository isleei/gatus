# Sentinel compose — build from THIS fork (Admin/WeCom live here; do not use twin/gatus).
#
# From this directory:
#   cp .env.example .env   # then edit placeholders (recommended)
#   docker compose up -d --build
#
# Or export GATUS_* vars in the shell (.env optional — required: false below).
# Unset / empty URL env vars → Gatus crashes on start (ErrEndpointWithNoURL) — fail-fast by design.
#
# Or pre-build at repo root: docker build -t gatus:local .  then set image: gatus:local

services:
  gatus-sentinel:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: gatus:local
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
      - GATUS_LOG_LEVEL=INFO
      - GATUS_PRIMARY_URL=${GATUS_PRIMARY_URL}
      - GATUS_WECOM_WEBHOOK_URL=${GATUS_WECOM_WEBHOOK_URL}
      - GATUS_SENTINEL_CRITICAL_URL_1=${GATUS_SENTINEL_CRITICAL_URL_1}
      - GATUS_SENTINEL_CRITICAL_URL_2=${GATUS_SENTINEL_CRITICAL_URL_2}
