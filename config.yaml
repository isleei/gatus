# Example / local template for this fork.
# Secrets MUST come from environment variables (Gatus expands $ENV / ${ENV} in YAML).
# Do NOT commit real DSNs, bcrypt hashes, webhooks, or customer hosts.

storage:
  type: postgres
  # Prefer a single DSN from env. Alternative:
  # path: "postgres://${GATUS_DB_USER}:${GATUS_DB_PASSWORD}@${GATUS_DB_HOST}:5432/gatus?sslmode=disable"
  path: "$GATUS_DB_URL"
  caching: true
  # Optional: auto-prune admin audit logs older than this duration (0 / omit = keep forever until manual DELETE)
  # admin-audit-max-age: 720h

security:
  basic:
    username: "$GATUS_ADMIN_USER"
    # Generate with: go run ./cmd/passwd  (do not commit the binary or real hashes)
    password-bcrypt-base64: "$GATUS_ADMIN_PASSWORD_BCRYPT_BASE64"

alerting:
  wecom:
    # Set GATUS_WECOM_WEBHOOK_URL to your WeCom robot webhook, or leave unset locally.
    webhook-url: "$GATUS_WECOM_WEBHOOK_URL"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: front-end
    group: core
    url: "https://twin.sh/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
      - "[RESPONSE_TIME] < 150"
    alerts:
      - type: wecom

  - name: back-end
    group: core
    url: "https://example.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts:
      - type: wecom

  - name: monitoring
    group: internal
    url: "https://example.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: wecom

  - name: nas
    group: internal
    url: "https://example.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: wecom

  - name: example-dns-query
    url: "8.8.8.8" # Address of the DNS server to use
    interval: 5m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"  # Matches any IPv4 address
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: wecom

  - name: icmp-ping
    url: "icmp://example.org"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: wecom

  - name: check-domain-expiration
    url: "https://example.org/"
    interval: 1h
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
    alerts:
      - type: wecom
